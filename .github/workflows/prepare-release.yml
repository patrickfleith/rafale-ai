name: Prepare release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

# Keep every merged PR queued rather than replacing pending releases.
concurrency:
  group: pypi-release
  queue: max

permissions: {}

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only execute code already merged into main, including for fork PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false

      - name: Bump, validate, and tag release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/prepare-release.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          overwrite: true

