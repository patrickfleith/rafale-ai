name: Release to PyPI

on:
  workflow_run:
    workflows: [Prepare release]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  artifacts:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      id: ${{ steps.dist.outputs.id }}
    steps:
      # Closed, unmerged PRs have a successful skipped build and no dist artifact.
      - name: Find distributions from the completed preparation run
        id: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "dist" and .expired == false) | .id')
          echo "id=${artifact_id}" >> "$GITHUB_OUTPUT"

  publish:
    needs: artifacts
    if: needs.artifacts.outputs.id != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rafale-ai/
    permissions:
      actions: read
      id-token: write
    steps:
      # Download only this run's artifacts; never execute code from a PR branch.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.id }}
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          skip-existing: true
